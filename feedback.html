<!DOCTYPE html>
<html lang="en">

</head>
  
<body>
<header>
  <div class="logo">
    <img src="logo.png" alt="GameVerse Logo">
  <h2>Game<span>Verse</span></h2>
  </div>
  
  <nav>
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>

  <section class="section">
  <h2 class="section-title">Give Us Your Feedback</h2>
  <p>Tell us what you think about the website and games.</p> 
    <form class="feedback-form">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
      
<label>Rate Your Experience:</label>
<select>
  <option>Excellent</option>
  <option>Good</option>
  <option>Average</option>
  <option>Poor</option>
</select>

<textarea placeholder="Your Feedback" rows="5"></textarea>

<button type="submit">Submit Feedback</button>

  </form>
</section>
  <footer>
  <p>© 2026 Gaming Hub</p>
</footer>
</body>
</html>
